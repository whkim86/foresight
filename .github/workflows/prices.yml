name: 가격 원장 수집

# 종목별 일봉 5년치를 Supabase Storage(<시장>/prices/) 에 쌓음 — ingest/prices.py
# 차트 화면은 이 원장(긴 기간·시가·거래량) 뒤에 예측 CSV 의 최근 실제값을 이어 붙이므로, 몇 시간 늦어도 화면은 최신
# 처음 한 번은 Actions 탭에서 수동 실행(전체 시장)으로 5년치를 채움 (약 15~20분)
on:
  schedule:
    - cron: "40 16 * * *"        # KST 01:40 빗썸 (0시 봉 확정 뒤)
    - cron: "50 23 * * *"        # KST 08:50 나스닥 (미국장 마감 뒤)
    - cron: "40 0 * * *"         # KST 09:40 업비트 (9시 봉 확정 뒤)
    - cron: "30 7 * * *"         # KST 16:30 코스피 (15:30 마감 뒤)
  workflow_dispatch:
    inputs:
      market:
        description: "시장 (비우면 전체: coin bithumb nasdaq kospi)"
        required: false
        default: ""
      full:
        description: "기존 파일 무시하고 5년치 다시 받기"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 일봉 수집 · 저장
        run: |
          ARGS=""
          for m in ${{ inputs.market }}; do ARGS="$ARGS --market $m"; done
          if [ "${{ inputs.full }}" = "true" ]; then ARGS="$ARGS --full"; fi
          python ingest/prices.py $ARGS
        env:
          SUPABASE_URL: https://qtzmfuaqzutzvnulfdel.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING: utf-8

      # 룰 성적표 (운영자 '룰 성적표' 화면) — 원장 수집이 일부 실패해도 계산은 함
      - name: 룰 성적표 계산
        if: always()
        run: python ingest/rules.py
        env:
          SUPABASE_URL: https://qtzmfuaqzutzvnulfdel.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING: utf-8

      # 📐 회원 대시보드 '차트 분석' (계산기는 비공개 저장소 whkim86/chart-rules — 읽기 전용 토큰, 2026-11-20)
      #   원장 기준일이 바뀐 시장만 다시 계산 → forecasts/<시장>/rules/ (이용권 있는 탭만 읽힘)
      - name: 차트 분석 계산기 받기
        if: always()
        uses: actions/checkout@v5
        with:
          repository: whkim86/chart-rules
          token: ${{ secrets.CHART_RULES_TOKEN }}
          path: _chart_rules

      - name: 차트 분석 계산
        if: always()
        run: |
          pip install --quiet numpy==2.1.3
          ARGS=""
          for m in ${{ inputs.market }}; do ARGS="$ARGS --market $m"; done
          python _chart_rules/build_dash.py $ARGS
        env:
          SUPABASE_URL: https://qtzmfuaqzutzvnulfdel.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING: utf-8
