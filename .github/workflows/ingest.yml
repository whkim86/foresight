name: 예측 데이터 수집

# 주 실행은 Supabase pg_cron 이 정시에 요청함 (supabase/stage4c.sql, stage4d.sql).
# 아래 GitHub 예약은 예비용 — GitHub 예약은 몇 시간씩 늦거나 건너뛸 수 있음
on:
  schedule:
    - cron: "15 0-2 * * *"       # KST 09:15, 10:15, 11:15
    - cron: "45 1 * * *"         # KST 10:45 (코인·나스닥 가격 차트)
    - cron: "15 14,15 * * *"     # KST 23:15, 00:15
  workflow_dispatch:             # Supabase 요청 · Actions 탭에서 수동 실행

permissions:
  contents: read
  actions: write                 # 아래 '예약 실행 유지' 단계용

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: CSV 수집 · 백업 · 판정 · 채점
        run: python ingest/ingest.py
        env:
          SUPABASE_URL: https://qtzmfuaqzutzvnulfdel.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}   # 4-2 에서 CSV 저장소를 비공개로 바꿀 때 추가
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8

      # 저장소에 60일간 커밋이 없으면 GitHub 이 예약 실행을 끄기 때문에, 매번 다시 켜둠
      - name: 예약 실행 유지
        if: always() && github.event_name == 'schedule'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ingest.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}
