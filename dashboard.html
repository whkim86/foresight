<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="매일 업데이트되는 코인·나스닥·코스피200 6일 예측 신호. 가입 후 7일 무료로 볼 수 있어요.">

<meta property="og:site_name" content="AI 신호등">
<meta property="og:title" content="AI 신호등 · 코인·나스닥·코스피 6일 예측">
<meta property="og:description" content="매일 업데이트되는 코인·나스닥·코스피200 6일 예측 신호. 가입 후 7일 무료로 볼 수 있어요.">

<meta property="og:image" content="https://www.ai-sinhodeung.co.kr/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20261006a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20261006a"></script>
<script src="assets/app.js?v=20261006a"></script>
</head>
<body>
<script>
(async function () {
  const { cfg, requireUser, renderHeader, esc, ICONS } = Portal;
  const me = await requireUser();
  if (!me) return;
  renderHeader(me);

  const params = new URLSearchParams(location.search);
  const key = cfg.MARKETS[params.get("m")] ? params.get("m") : "coin";
  const market = cfg.MARKETS[key];
  // 코인 탭: 업비트 | 빗썸 전환 (마지막에 본 거래소를 기억)
  const exList = market.exchanges || [{ key: "", data: key, note: market.note, views: market.views }];
  let exKey = params.get("ex");
  if (!exList.some((x) => x.key === exKey)) {
    try { exKey = localStorage.getItem("dash-ex-" + key); } catch (e) { exKey = null; }
    if (!exList.some((x) => x.key === exKey)) exKey = exList[0].key;
  }
  let ex = exList.find((x) => x.key === exKey);
  let viewKey = ex.views.some((v) => v.key === params.get("v")) ? params.get("v") : ex.views[0].key;
  document.title = market.name + " · AI 신호등";

  const marketTabs = Object.entries(cfg.MARKETS).map(([k, m]) =>
    `<a href="dashboard.html?m=${k}" ${k === key ? 'aria-current="page"' : ""} class="${me.acc.tabs[k].open ? "" : "locked"}">${esc(m.name)}</a>`).join("");

  // 이용권이 없는 탭은 대시보드 대신 잠금 안내
  if (!me.acc.tabs[key].open) {
    document.body.insertAdjacentHTML("beforeend", `
      <main class="dash">
        <div class="dash-bar">
          <div class="dash-title"><a class="back" href="index.html">← 포털로</a><h1>${esc(market.name)}</h1></div>
          <nav class="tabs" aria-label="시장">${marketTabs}</nav>
        </div>
        <div class="card locked-panel">
          <span class="dot">${ICONS.lock}</span>
          <h2>${esc(market.name)} 탭이 잠겨 있어요</h2>
          <p class="hint">${me.acc.inTrial ? "" : "무료체험 기간이 끝났어요. "}마이페이지에서 이 탭을 골라 입금 신청하시면, 운영자가 확인한 뒤 바로 열어드려요.</p>
          <a class="btn" href="mypage.html">마이페이지에서 열기</a>
        </div>
      </main>`);
    Portal.track(`dash:${key}:locked`);
    return;
  }
  const viewTabs = ex.views.map((v) =>
    `<button type="button" role="tab" data-view="${v.key}">${esc(v.label)}</button>`).join("");

  document.body.insertAdjacentHTML("beforeend", `
    <main class="dash">
      <div class="dash-bar">
        <div class="dash-title">
          <a class="back" href="index.html">← 포털로</a>
          <h1>${esc(market.name)}</h1>
          ${market.exchanges ? `<div class="ex-switch" role="tablist" aria-label="거래소">${exList.map((x) =>
            `<button type="button" role="tab" data-ex="${x.key}">${esc(x.label)}</button>`).join("")}</div>` : ""}
          <span class="note" id="dash-note"></span>
        </div>
        <div class="tabs">
          <div class="tabs" role="tablist" aria-label="보기">${viewTabs}</div>
          <span class="tabs-divider"></span>
          <nav class="tabs" aria-label="시장">${marketTabs}</nav>
        </div>
      </div>
      <div class="frame-wrap" id="frames"><div class="frame-loading" id="loading">불러오는 중…</div></div>
    </main>`);

  // 보기마다 iframe 하나씩, 처음 열 때만 불러오고 이후엔 숨김/표시만 바꿔서 빠르게 전환
  const frames = {};
  function showView(vk) {
    viewKey = vk;
    const fk = ex.key + ":" + vk;
    Portal.track(`dash:${ex.data}:${vk}`);
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === vk)));
    document.querySelectorAll("[data-ex]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.ex === ex.key)));
    document.getElementById("dash-note").textContent = ex.note;
    if (!frames[fk]) {
      const v = ex.views.find((x) => x.key === vk);
      const f = document.createElement("iframe");
      f.src = v.url;
      f.title = market.name + (ex.label ? " " + ex.label : "") + " " + v.label;
      f.loading = "eager";
      document.getElementById("loading").hidden = false;
      f.addEventListener("load", () => { if (ex.key + ":" + viewKey === fk) document.getElementById("loading").hidden = true; });
      document.getElementById("frames").appendChild(f);
      frames[fk] = f;
    } else {
      document.getElementById("loading").hidden = true;
    }
    Object.entries(frames).forEach(([k, f]) => (f.hidden = k !== fk));
    history.replaceState(null, "", `dashboard.html?m=${key}${ex.key ? "&ex=" + ex.key : ""}&v=${vk}`);
  }
  function showEx(xk) {
    ex = exList.find((x) => x.key === xk);
    try { localStorage.setItem("dash-ex-" + key, xk); } catch (e) {}
    showView(ex.views.some((v) => v.key === viewKey) ? viewKey : ex.views[0].key);
  }
  document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => showView(b.dataset.view)));
  document.querySelectorAll("[data-ex]").forEach((b) => b.addEventListener("click", () => { if (b.dataset.ex !== ex.key) showEx(b.dataset.ex); }));
  showView(viewKey);
})();
</script>
</body>
</html>
