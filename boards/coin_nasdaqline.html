/* reading card */
.read{padding:22px}

/* picker */
.picker{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.pick-row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:12px}

.cc::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--hold-ink)}
.cc.up::before{background:var(--up)} .cc.dn::before{background:var(--dn)} .cc.mx::before{background:#E0A020}
.cc.stale,.cc.hold{font-weight:500;color:var(--muted)}

@media (max-width:960px){
  .panel{grid-template-columns:1fr}
}

<div class="wrap">
  <header class="top">
    <div>
      <h1>나스닥 6일 가격 예측 보드</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="loader">
      <label class="btn"><input type="file" id="file" accept=".csv,text/csv"><span>새 CSV 불러오기</span></label>

    </div>

</script>

<script>
(function(){
'use strict';
var HOST=true;
var HOST_FILE='final_rst_dfa_web_Day_raw_v3.csv';
var CFG={main:'SP500',noun:'종목',example:'NVDA',unit:'',with_:'과 '};
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var fmtDate=function(s){return String(s).replace(/\s*Day\s*$/i,'')};
var round=Math.round;

var VLAB={up:'상승',dn:'하락',mx:'혼돈',hold:'보류',stale:'지연'};
var METRIC={c:'종가',h:'고점',l:'저점'};
var METRIC_KEY={c:'c',h:'h',l:'l'};

/* ---------- CSV ---------- */
function parseCSV(text){
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){row.push(f);f='';}
    else if(ch==='\n'||ch==='\r'){
      if(ch==='\r'&&text[i+1]==='\n') i++;
      row.push(f);f='';
      if(row.some(function(x){return x!==''})) rows.push(row);
      row=[];
    }else f+=ch;
  }
  if(f!==''||row.length){row.push(f); if(row.some(function(x){return x!==''})) rows.push(row);}
  return rows;
}
function dayIndex(s){
  var m=String(s).match(/(\d{1,2})\s*-\s*(\d{1,2})/); if(!m) return null;
  return Math.round(Date.UTC(2001,+m[1]-1,+m[2])/86400000);
}
function wrapDelta(d){ if(d>182) d-=365; if(d<-182) d+=365; return d; }

/* ---------- build ---------- */
function build(text){
  var rows=parseCSV(text.replace(/^\uFEFF/,''));
  if(rows.length<2) throw new Error('데이터 행이 없습니다. 첫 행은 컬럼명, 둘째 행부터 데이터여야 합니다.');
  var head=rows[0].map(function(h){return h.trim().toLowerCase()});
  var need=['pred_day','coin','seq','date','variable','value_close','value_high','value_low'];
  var miss=need.filter(function(k){return head.indexOf(k)<0});
  if(miss.length) throw new Error('없는 컬럼: '+miss.join(', '));
  var ix={}; need.forEach(function(k){ix[k]=head.indexOf(k)});
  var byPred={}, bad=0;
  rows.slice(1).forEach(function(r){
    var pd=(r[ix.pred_day]||'').trim(), coin=(r[ix.coin]||'').trim(), date=(r[ix.date]||'').trim(), va=(r[ix.variable]||'').trim();
    var seq=parseInt(r[ix.seq],10), c=parseFloat(r[ix.value_close]), h=parseFloat(r[ix.value_high]), l=parseFloat(r[ix.value_low]);
    if(!pd||!coin||!date||isNaN(seq)||!isFinite(c)||!isFinite(h)||!isFinite(l)){bad++;return;}
    var P=byPred[pd]||(byPred[pd]={});
    var co=P[coin]||(P[coin]={name:coin,histMap:{},mod:{}});
    var e={date:date,c:c,h:h,l:l};
    if(seq===0) co.histMap[date]=e;
    else if(va){ (co.mod[va]||(co.mod[va]={}))[seq]=e; }
  });
  var preds=Object.keys(byPred).sort();
  if(!preds.length) throw new Error('읽을 수 있는 행이 없습니다. 컬럼 형식을 확인해 주세요.');
  var out={preds:preds,days:{},bad:bad};
  preds.forEach(function(pd){ out.days[pd]=finalize(byPred[pd],pd); });
  return out;
}
function numKey(n){var m=String(n).match(/\d+/); return m?parseInt(m[0],10):1e9}
function finalize(P,pd){
  var coins=new Map(), modelSet={};
  Object.keys(P).sort().forEach(function(k){
    var co=P[k], names=Object.keys(co.mod);
    if(!names.length) return;
    names.forEach(function(n){modelSet[n]=1});
    var anchorDate=null;
    names.forEach(function(n){ if(!anchorDate&&co.mod[n][1]) anchorDate=co.mod[n][1].date; });
    var hd=Object.keys(co.histMap);
    if(!anchorDate&&!hd.length) return;
    var anchor=dayIndex(anchorDate||hd[0]);
    var hist=hd.map(function(d){var e=co.histMap[d]; return {n:wrapDelta(dayIndex(d)-anchor),date:d,c:e.c,h:e.h,l:e.l}}).sort(function(a,b){return a.n-b.n});
    var models={};
    names.forEach(function(n){
      models[n]=Object.keys(co.mod[n]).map(function(s){var e=co.mod[n][s]; return {seq:+s,n:wrapDelta(dayIndex(e.date)-anchor),date:e.date,c:e.c,h:e.h,l:e.l}}).sort(function(a,b){return a.seq-b.seq});
    });
    var s1=anchorDate;
    var delta=s1?wrapDelta(dayIndex(s1)-dayIndex(pd)):0;
    coins.set(k,{name:k,hist:hist,models:models,modelNames:names.slice().sort(function(a,b){return numKey(a)-numKey(b)}),d1:s1,stale:s1?(delta<0||delta>1):false});
  });
  var order=Object.keys(modelSet).sort(function(a,b){return numKey(a)-numKey(b)});
  var idx={}; order.forEach(function(n,i){idx[n]=i});
  return {coins:coins,order:order,idx:idx};
}

/* ---------- stats helpers ---------- */
function median(a){ if(!a.length) return NaN; var s=a.slice().sort(function(x,y){return x-y}), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; }
function pct(x,d){ var v=x*100; return (v>=0?'+':'')+v.toFixed(d==null?1:d)+'%'; }
function fmtNum(v){
  var a=Math.abs(v);
  if(a>=1000) return Math.round(v).toLocaleString('ko-KR');
  if(a>=1) return v.toLocaleString('ko-KR',{maximumFractionDigits:2});
  return v.toLocaleString('ko-KR',{maximumSignificantDigits:4});
}
function fmtAxis(v,step){
  var a=Math.abs(v);
  if(a>=1e8){ var d=Math.max(0,Math.min(4,Math.ceil(-Math.log10(step/1e8)-1e-9))); return (v/1e8).toFixed(d)+'억'; }
  if(step>=1) return Math.round(v).toLocaleString('ko-KR');
  var dd=Math.min(8,Math.max(0,Math.ceil(-Math.log10(step)-1e-9)));
  return v.toLocaleString('ko-KR',{minimumFractionDigits:dd,maximumFractionDigits:dd});
}
function niceTicks(lo,hi,count){
  var span=hi-lo;
  if(!(span>0)){ var s=Math.abs(hi)||1; lo-=s*0.05; hi+=s*0.05; span=hi-lo; }
  var raw=span/count, mag=Math.pow(10,Math.floor(Math.log10(raw))), norm=raw/mag;
  var step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  var start=Math.floor(lo/step+1e-9)*step, ticks=[], v=start, g=0;
  while(g++<20){ ticks.push(+v.toPrecision(12)); if(v>=hi-1e-12) break; v+=step; }
  return {ticks:ticks,step:step};
}

/* ---------- analysis ---------- */
function analyze(co,pd){
  var names=co.modelNames, N=names.length;
  var a={n:N,stale:co.stale,d1:co.d1,hasBase:co.hist.length>0};
  var seqs=[1,2,3,4,5,6];
  var bySeq=seqs.map(function(s){
    return names.map(function(m){var p=co.models[m].filter(function(x){return x.seq===s})[0]; return p?p:null});
  });
  var medc=bySeq.map(function(arr){return median(arr.filter(Boolean).map(function(p){return p.c}))});
  var spread=bySeq.map(function(arr,i){
    var v=arr.filter(Boolean).map(function(p){return p.c}); if(!v.length||!(medc[i]>0)) return NaN;
    return (Math.max.apply(null,v)-Math.min.apply(null,v))/medc[i];
  });
  var base=null;
  if(a.hasBase){ var lh=co.hist[co.hist.length-1]; base={c:lh.c,date:lh.date}; }
  a.base=base;
  var ref=base?base.c:medc[0];
  a.path=medc.map(function(m,i){ return isFinite(m)&&ref>0?(m/ref-1):NaN; });
  a.spread1=spread[0]; a.spread6=spread[5];
  // D+1 range from high/low
  var rng=[]; bySeq[0].forEach(function(p){ if(p&&p.c>0) rng.push((Math.max(p.h,p.l)-Math.min(p.h,p.l))/p.c); });
  a.range1=median(rng);
  // outliers
  var devs=names.map(function(m){
    var s=0,k=0; co.models[m].forEach(function(p){ var md=medc[p.seq-1]; if(md>0){ s+=Math.abs(p.c/md-1); k++; } });
    return k?s/k:0;
  });
  var md=median(devs), lim=Math.max(0.05,3*md);
  a.outliers=names.map(function(m,i){return {name:m,dev:devs[i]}}).filter(function(o){return o.dev>lim}).sort(function(x,y){return y.dev-x.dev}).map(function(o){return o.name});
  // inverted high/low
  a.inverted=names.filter(function(m){return co.models[m].some(function(p){return p.h<p.l})});
  // verdict
  if(a.stale){ a.verdict='stale'; return a; }
  if(!base){ a.verdict='hold'; return a; }

  a.dn=r.filter(function(x){return x<-a.thr}).length;

function reading(a,co,pd){
  var out={why:[],flow:[]};

    out.why.push('D+1 날짜('+d1+')가 예측수행일('+fmtDate(pd)+')과 어긋나 있어 방향을 판단하지 않았어요.');
    if(!a.hasBase) out.why.push('직전 실제값도 없어 예측선만 표시합니다. 데이터가 갱신됐는지 확인해 주세요.');
  }else if(a.verdict==='hold'){
    out.why.push('직전 실제값이 없어 D+1이 오르는지 내리는지 판단할 수 없어요.');
    out.why.push('대신 모델 중앙값 기준으로 D+1 대비 이후 흐름을 아래에 적었어요.');
  }else{
    var lab=fmtDate(a.base.date);
    out.why.push(a.n+'개 모델 중 '+a.up+'개는 D+1 종가를 직전 실제 종가('+lab+')보다 높게, '+a.dn+'개는 낮게 예측했어요'+(a.flat?' (보합 '+a.flat+'개)':'')+'.');
    out.why.push('D+1 종가 중앙값은 직전 종가 대비 '+pct(a.med1)+'이고, 모델 범위는 '+pct(a.min1)+' ~ '+pct(a.max1)+'입니다.');
    var m=a.n||1;
    if(a.verdict==='up') out.why.push(round(a.up/m*100)+'%의 모델이 상승 쪽이라 상승으로 판단했어요.');
    else if(a.verdict==='dn') out.why.push(round(a.dn/m*100)+'%의 모델이 하락 쪽이라 하락으로 판단했어요.');
    else if(a.up/m>=0.6||a.dn/m>=0.6) out.why.push('다수 모델이 한 방향이지만 중앙값 변화가 작아(기준 ±'+(a.thr*100).toFixed(1)+'%) 혼돈으로 봤어요.');
    else out.why.push('상승 '+a.up+'개, 하락 '+a.dn+'개로 의견이 갈려 방향을 단정하기 어려워 혼돈으로 봤어요.');
  }
  // flow
  var p=a.path, ok=p.every(function(x){return isFinite(x)});
  if(ok){
    var d3=p[2], d6=p[5], mx=Math.max.apply(null,p), mn=Math.min.apply(null,p), iMax=p.indexOf(mx), iMin=p.indexOf(mn);
    var word=d6>=0.05?'뚜렷한 상승':d6>=0.01?'완만한 상승':d6>-0.01?'횡보':d6>-0.05?'완만한 하락':'뚜렷한 하락';
    var s1=a.hasBase?'모델 중앙값 경로는 직전 실제 종가 대비 D+1 '+pct(p[0])+', D+3 '+pct(d3)+', D+6 '+pct(d6)+'로 '+word+' 흐름입니다.'
                    :'모델 중앙값 경로는 D+1 대비 D+3 '+pct(d3)+', D+6 '+pct(d6)+'로 '+word+' 흐름입니다.';
    if(iMax<=4&&mx-d6>=0.02) s1+=iMax===0?' D+1이 정점이고 이후 내려가는 모양이에요.':' D+'+(iMax+1)+' 부근에서 정점을 찍고 되돌리는 모양이에요.';
    else if(iMin<=4&&d6-mn>=0.02) s1+=iMin===0?' D+1이 저점이고 이후 올라가는 모양이에요.':' D+'+(iMin+1)+' 부근에서 저점을 찍고 반등하는 모양이에요.';
    out.flow.push(s1);

  }

  if(a.outliers.length){
    out.flow.push(a.outliers.slice(0,3).join(', ')+(a.outliers.length>3?' 등 ':' ')+a.outliers.length+'개 모델은 나머지와 크게 달라 차트 범위를 넓혀요. "튀는 모델 끄기"를 누르면 나머지 흐름이 더 잘 보여요.');
  }

}

  cur={D:D,an:an,pd:pd};
  state.filter='all'; state.q='';
  var list=altList();

}
function altNames(){ var r=[]; cur.D.coins.forEach(function(co,k){ if(k!==CFG.main) r.push(k); }); return r; }
var VORDER={up:0,mx:1,dn:2,hold:3,stale:4};
function altList(){
  var q=state.q.trim().toUpperCase();
  return altNames().filter(function(k){
    var v=cur.an.get(k).verdict;
    if(state.filter!=='all'&&v!==state.filter) return false;
    return !q||k.toUpperCase().indexOf(q)>=0;
  }).sort(function(x,y){
    var ax=cur.an.get(x), ay=cur.an.get(y);
    if(VORDER[ax.verdict]!==VORDER[ay.verdict]) return VORDER[ax.verdict]-VORDER[ay.verdict];
    if(ax.verdict==='up') return ay.med1-ax.med1;
    if(ax.verdict==='dn') return ax.med1-ay.med1;
    if(ax.verdict==='mx') return Math.abs(ay.med1)-Math.abs(ax.med1);
    return x<y?-1:1;
  });
}

      tip.style.left=left+'px';
    }
    function hide(){tip.style.display='none';gd.style.display='none';hd.style.display='none';P.setHi(null);}
    svg.addEventListener('pointermove',show); svg.addEventListener('pointerdown',show); svg.addEventListener('pointerleave',hide);
  };
  return P;
}

/* ---------- page ---------- */
function renderHeader(){
  var sel='';
  if(DATA.preds.length>1){
    sel='<select id="predSel" aria-label="예측 수행일">'+DATA.preds.map(function(p){return '<option value="'+esc(p)+'"'+(p===state.pred?' selected':'')+'>'+esc(fmtDate(p))+'</option>'}).join('')+'</select>';
  }else sel='<b>'+esc(fmtDate(state.pred))+'</b>';
  $('#sub').innerHTML='예측 수행일 '+sel+', '+CFG.noun+' '+cur.D.coins.size+'개, 모델 '+cur.D.order.length+'개, '+esc(state.src);
  var ps=$('#predSel'); if(ps) ps.onchange=function(){setPred(ps.value);renderAll();};
}
function counts(){
  var c={all:0,up:0,mx:0,dn:0,hold:0,stale:0};
  altNames().forEach(function(k){ c.all++; c[cur.an.get(k).verdict]++; });
  return c;
}
function renderAll(){
  renderHeader();
  var hasBtc=cur.D.coins.has(CFG.main);
  var h='';
  if(hasBtc){
    h+='<section aria-labelledby="btc-h"><div class="sec-head"><h2 id="btc-h">'+CFG.main+'</h2><p>실제값(굵은 실선)과 예측 모델 '+cur.D.order.length+'개의 선을 함께 보여줍니다</p></div><div class="panel" id="pBtc"></div></section>';
  }
  h+='<section aria-labelledby="alt-h"><div class="sec-head"><h2 id="alt-h">'+CFG.noun+'</h2><p>'+CFG.noun+'을 고르면 '+CFG.main+CFG.with_+'같은 차트와 D+1 해석이 나옵니다</p></div>';
  h+='<div class="picker"><div class="pick-row"><label class="coinpick">'+CFG.noun+' 검색<input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="예: '+CFG.example+'"></label><div class="seg" id="flt" role="group" aria-label="D+1 판단별 보기"></div></div>';
  h+='<div class="coinlist" id="coinlist"></div>';
  h+='<div class="keyrow"><span><i style="background:var(--up)"></i>상승</span><span><i style="background:#E0A020"></i>혼돈</span><span><i style="background:var(--dn)"></i>하락</span><span><i style="background:var(--hold-ink)"></i>보류(실제값 없음), 지연(D+1 날짜 어긋남)</span></div></div>';
  h+='<div class="panel" id="pAlt"></div></section>';
  $('#app').innerHTML=h;
  panels={};
  if(hasBtc){ panels.btc=Panel($('#pBtc')); panels.btc.setCoin(CFG.main); }
  panels.alt=Panel($('#pAlt'));
  $('#q').oninput=function(){ state.q=this.value; renderPicker(); };
  $('#flt').onclick=function(ev){ var b=ev.target.closest('button'); if(!b) return; state.filter=b.dataset.f; renderPicker(); };
  $('#coinlist').onclick=function(ev){ var b=ev.target.closest('button[data-coin]'); if(!b) return; selectAlt(b.dataset.coin); };
  renderPicker();
  if(state.alt) selectAlt(state.alt);
  else $('#pAlt').innerHTML='<p class="empty">'+CFG.noun+' 데이터가 없어요.</p>';
}
function renderPicker(){
  var c=counts(), F=[['all','전체'],['up','상승'],['mx','혼돈'],['dn','하락'],['hold','보류'],['stale','지연']];
  $('#flt').innerHTML=F.filter(function(f){return f[0]==='all'||c[f[0]]>0}).map(function(f){return '<button data-f="'+f[0]+'" aria-pressed="'+(state.filter===f[0])+'">'+f[1]+' '+c[f[0]]+'</button>'}).join('');
  var list=altList();
  $('#coinlist').innerHTML=list.length?list.map(function(k){
    var v=cur.an.get(k).verdict;
    return '<button class="cc '+v+'" data-coin="'+esc(k)+'" aria-pressed="'+(k===state.alt)+'">'+esc(k)+'</button>';
  }).join(''):'<span class="fine">조건에 맞는 '+CFG.noun+'이 없어요.</span>';
}
function selectAlt(name){
  state.alt=name;
  if(panels.alt&&cur.D.coins.has(name)) panels.alt.setCoin(name);
  $('#coinlist').querySelectorAll('.cc').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.coin===name)});
}

/* ---------- boot / upload ---------- */
var msg=$('#msg');
function setMsg(t,cls){msg.className=cls||'';msg.textContent=t;}
function load(text,src){
  var d=build(text);
  DATA=d; state.src=src;
  setPred(d.preds[d.preds.length-1]);
  renderAll();
  return d;
}
try{ void 0; }
catch(err){ $('#app').innerHTML='<p class="empty">'+esc(err.message)+'</p>'; }
$('#file').addEventListener('change',function(ev){
  var f=ev.target.files[0]; if(!f) return;
  setMsg('불러오는 중','');
  var fr=new FileReader();
  fr.onload=function(){
    try{ var d=load(String(fr.result),f.name); setMsg('불러왔습니다'+(d.bad?' ('+d.bad+'행은 형식이 달라 건너뜀)':''),''); }
    catch(err){ setMsg(err.message,'err'); }
  };
  fr.onerror=function(){setMsg('파일을 읽지 못했습니다. .csv 파일인지 확인해 주세요.','err')};
  fr.readAsText(f,'utf-8');
  ev.target.value='';
});
if(HOST&&/^https?:$/.test(location.protocol)){
  portalFetch()
    .then(function(r){if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer();})
    .then(function(buf){ var d=load(new TextDecoder('utf-8').decode(buf),'최신 예측 데이터'); setMsg('최신 예측을 불러왔어요'+(d.bad?' ('+d.bad+'행은 형식이 달라 건너뜀)':''),''); })
    .catch(function(){ setMsg('데이터를 불러오지 못했어요. 새로고침하거나 로그인·이용 기간을 확인해 주세요','err'); });
}
if(window.ResizeObserver){
  var t=null, lastW=0;
  new ResizeObserver(function(){
    var w=document.body.clientWidth; if(Math.abs(w-lastW)<2) return; lastW=w;
    clearTimeout(t); t=setTimeout(function(){ if(!cur) return; Object.keys(panels).forEach(function(k){ if(panels[k]&&panels[k].coin) panels[k].draw(); }); },80);
  }).observe(document.body);
}
})();
</script>
</body>
</html>
