<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>나스닥 6일 예측 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F8; --surface:#FFFFFF; --ink:#101A33; --muted:#58637A;
  --line:#DCE1EA; --line-strong:#C3CBD8;
  --buy:#D92D3A; --buy-text:#C0242F;
  --sell-bg:#E4ECFB; --sell-ink:#1D4FB0; --sell-mini:#9DB8EE;
  --wait-bg:#ECEEF3; --wait-ink:#5A6478; --wait-mini:#D3D8E1;
  --m-close:#101A33; --m-high:#C2760A; --m-low:#0E8A8C;
  --focus:#2563D9; --shadow:0 8px 24px rgba(16,26,51,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1220; --surface:#151C2E; --ink:#E9EDF6; --muted:#98A3BA;
    --line:#262F47; --line-strong:#35405C;
    --buy:#E2404C; --buy-text:#FF6B75;
    --sell-bg:#1B2A4A; --sell-ink:#8DB2FF; --sell-mini:#2C4A86;
    --wait-bg:#222B41; --wait-ink:#98A3BA; --wait-mini:#3A445B;
    --m-close:#E9EDF6; --m-high:#F0A93B; --m-low:#3CC3C5;
    --focus:#8DB2FF; --shadow:0 8px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#0D1220; --surface:#151C2E; --ink:#E9EDF6; --muted:#98A3BA;
  --line:#262F47; --line-strong:#35405C;
  --buy:#E2404C; --buy-text:#FF6B75;
  --sell-bg:#1B2A4A; --sell-ink:#8DB2FF; --sell-mini:#2C4A86;
  --wait-bg:#222B41; --wait-ink:#98A3BA; --wait-mini:#3A445B;
  --m-close:#E9EDF6; --m-high:#F0A93B; --m-low:#3CC3C5;
  --focus:#8DB2FF; --shadow:0 8px 24px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:24px 20px 56px}
h1,h2,h3,p{margin:0}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:14px;margin-top:2px}
.top .sub select{background:transparent;border:0;border-bottom:1px solid var(--line-strong);padding:0 2px;font-weight:600;color:var(--ink)}
.loader{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;border:1px solid var(--line-strong);background:var(--surface);
  border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.btn:focus-within{outline:2px solid var(--focus);outline-offset:2px}
#notice{margin-top:6px;color:var(--m-high);font-size:13px;max-width:78ch;line-height:1.55}
#msg.err{color:var(--buy-text)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;margin-bottom:28px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.pick-head{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
.pick-note{color:var(--muted);font-size:14px}
.ticker{font-size:clamp(44px,8vw,76px);line-height:1;font-weight:700;letter-spacing:-.03em;margin-top:6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.flag{font-size:12px;font-weight:500;letter-spacing:0;color:var(--m-high);border:1px solid currentColor;border-radius:999px;padding:1px 9px;white-space:nowrap}
.stats{display:flex;gap:22px;margin:0}
.stats div{display:flex;flex-direction:column-reverse}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{margin:0;font-size:22px;font-weight:600}
.stats dd small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}

.strip{display:grid;grid-template-columns:52px repeat(6,minmax(0,1fr));gap:6px;align-items:stretch}
.strip .colh{font-size:12px;color:var(--muted);text-align:center;line-height:1.25;padding-bottom:2px}
.strip .colh b{display:block;font-size:13px;font-weight:600;color:var(--ink)}
.strip .rowh{align-self:center;font-size:13px;color:var(--muted);line-height:1.3}
.cell{border-radius:8px;text-align:center;min-height:58px;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:6px 0}
.cell .pct{font-size:18px;font-weight:700;line-height:1.15}
.cell .sig{font-size:11px;font-weight:500;line-height:1.2}
.cell.buy{background:var(--buy);color:#fff}
.cell.wait{background:var(--wait-bg);color:var(--wait-ink)}
.cell.sell{background:var(--sell-bg);color:var(--sell-ink)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:12px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:12px;height:12px;border-radius:3px;display:inline-block}
i.k-buy{background:var(--buy)} i.k-wait{background:var(--wait-mini)} i.k-sell{background:var(--sell-mini)}

.insight{background:var(--ink);color:var(--paper);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
:root[data-theme="dark"] .insight{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .insight{background:var(--surface);color:var(--ink);border:1px solid var(--line)}}
.insight h3{font-size:15px;font-weight:600}
.insight p{font-size:15px;line-height:1.65}
.insight .next{border-top:1px solid color-mix(in srgb,currentColor 22%,transparent);padding-top:14px;margin-top:2px}
.insight ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.insight li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;align-items:baseline}
.insight li button{background:none;border:0;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent);color:inherit}
.insight li span{opacity:.75;text-align:right}

/* ranking */
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;align-items:flex-end;margin-bottom:10px}
.sec-head h2{font-size:19px;font-weight:700}
.sec-head p{font-size:13px;color:var(--muted)}
details.how{font-size:13px;color:var(--muted);margin-bottom:12px}
details.how summary{cursor:pointer;width:max-content}
details.how p{margin-top:6px;max-width:70ch;line-height:1.6}
.rank-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto;margin-bottom:12px}
table.rank{width:100%;border-collapse:collapse;min-width:640px}
.rank th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.rank td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.rank tr:last-child td{border-bottom:0}
.rank tbody tr:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.rank .no{width:44px;color:var(--muted);font-weight:500}
.rank .nm button{background:none;border:0;padding:0;font-weight:700;font-size:16px}
.rank .nm button:hover{text-decoration:underline;text-underline-offset:3px}
.rank .nm .flag{margin-left:8px}
.bar{display:flex;align-items:center;gap:10px;min-width:150px}
.bar i{display:block;height:8px;border-radius:4px;background:var(--ink);opacity:.85}
.bar span{font-weight:600;min-width:2.2em}
.bar .track{flex:1;height:8px;border-radius:4px;background:var(--wait-bg);position:relative}
.bar .track i{position:absolute;left:0;top:0}
.mini{display:grid;grid-template-columns:repeat(6,16px);grid-auto-rows:9px;gap:2px}
.mini b{border-radius:2px;display:block}
.mini b.buy{background:var(--buy)} .mini b.wait{background:var(--wait-mini)} .mini b.sell{background:var(--sell-mini)}
.more{display:block;margin:0 auto 12px}
.rank td.d1{color:var(--muted);font-size:13.5px}
details.stale{font-size:13px;color:var(--muted);margin-top:6px}
details.stale summary{cursor:pointer;width:max-content}
details.stale p{margin:6px 0 10px;max-width:70ch;line-height:1.6}
details.stale .chips{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow:auto;padding:2px}
.stale-note{font-size:13px;color:var(--muted);margin:0 0 10px}
.stale-note .flag{margin-right:8px}

/* chart */
.chart-card{margin-top:32px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 22px 8px}
.chart-head{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.chart-head h2{font-size:19px;font-weight:700}
.chart-head p{font-size:13px;color:var(--muted);margin-top:2px}
.coinpick{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.coinpick input{width:150px;border:1px solid var(--line-strong);border-radius:10px;background:var(--paper);padding:8px 12px;font-size:16px;font-weight:700}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 28px;margin-bottom:10px}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp .lab{font-size:12px;color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip small{font-size:11.5px;color:var(--muted);font-weight:400}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.chip .sw{width:16px;height:3px;border-radius:2px;display:inline-block}
.chip.m[aria-pressed="true"]{background:transparent;color:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chart-box{position:relative;touch-action:pan-y;margin-top:4px}
.chart-box svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:inherit;fill:var(--muted)}
.g{stroke:var(--line);stroke-width:1}
.g50{stroke:var(--line-strong);stroke-width:1.2;stroke-dasharray:4 4}
.yl,.xl2{font-size:11.5px}
.xl{font-size:12.5px;font-weight:600;fill:var(--ink)}
.ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ln.m-c{stroke:var(--m-close);stroke-width:3} .ln.m-h{stroke:var(--m-high)} .ln.m-l{stroke:var(--m-low)}
.mk{stroke:var(--surface);stroke-width:2}
.mk.buy{fill:var(--buy)} .mk.wait{fill:var(--wait-mini)} .mk.sell{fill:var(--sell-mini)}
.guide{stroke:var(--line-strong);stroke-width:1}
.tip{position:absolute;top:8px;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:10px;padding:10px 12px;font-size:13px;min-width:190px;box-shadow:var(--shadow);z-index:2}
.tip-h{font-weight:600;margin-bottom:6px}
.tip-h span{font-weight:400;color:var(--muted);margin-left:6px}
.tip-r{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center;padding:2px 0}
.tip-r .sw{width:12px;height:3px;border-radius:2px}
.tip-r b{font-weight:700}
.tag{font-style:normal;font-size:11.5px;border-radius:999px;padding:0 8px;line-height:1.6;white-space:nowrap}
.tag.buy{background:var(--buy);color:#fff}
.tag.wait{background:var(--wait-bg);color:var(--wait-ink)}
.tag.sell{background:var(--sell-bg);color:var(--sell-ink)}
.chart-key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted);margin:6px 0 14px}
.chart-key span{display:inline-flex;align-items:center;gap:6px}
.chart-key i{width:11px;height:11px;border-radius:50%;display:inline-block}
.chart-key i.k-buy{background:var(--buy)} .chart-key i.k-wait{background:var(--wait-mini)} .chart-key i.k-sell{background:var(--sell-mini)}
.tbl{overflow-x:auto;border-top:1px solid var(--line);margin:0 -22px;padding:0 22px 14px}
table.det{width:100%;border-collapse:collapse;min-width:520px;font-size:14px}
.det th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:10px 8px 8px;white-space:nowrap}
.det td{padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap}
.det td b{font-weight:700;margin-right:8px}
.det td.d{font-weight:600}
.det td.d small{color:var(--muted);font-weight:400;margin-left:6px}
.empty{padding:40px 8px;color:var(--muted);text-align:center}

.btc{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:32px;overflow:hidden}
.btc-main{padding:24px}
.btc-note{padding:24px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.btc-note h3{font-size:15px;font-weight:600}
.btc-note p{font-size:15px;line-height:1.65}
.btc-note .btn{align-self:flex-start;margin-top:auto}
.ticker.btc-t{font-size:clamp(36px,6vw,56px)}
.regime{font-size:14px;font-weight:600;letter-spacing:0;border-radius:999px;padding:3px 12px;line-height:1.4}
.regime.up{background:var(--buy);color:#fff}
.regime.dn{background:var(--sell-bg);color:var(--sell-ink)}
.regime.mx{background:var(--wait-bg);color:var(--wait-ink)}
.alt-head{margin-bottom:12px}
.alt-head h2{font-size:22px}
[hidden]{display:none!important}
.btn:disabled{opacity:.5;cursor:default}
@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .btc{grid-template-columns:1fr}
  .btc-note{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:560px){
  .wrap{padding:18px 14px 48px}
  .pick,.insight,.btc-main,.btc-note{padding:18px}
  .strip{grid-template-columns:40px repeat(6,minmax(0,1fr));gap:4px}
  .cell{min-height:54px;border-radius:6px}
  .cell .pct{font-size:15px}
  .cell .sig{font-size:10px}
  .strip .rowh{font-size:11.5px}
  .chart-card{padding:16px 14px 6px}
  .tbl{margin:0 -14px;padding:0 14px 12px}
  .stats{gap:16px}
  .stats dd{font-size:19px}
  table.rank{min-width:0}
  .rank th,.rank td{padding:9px 8px}
  .rank .no{width:28px}
  .rank th{white-space:normal;line-height:1.3}
  .mini{grid-template-columns:repeat(6,13px)}
  .bar{min-width:0}
  .bar .track{display:none}
  .rank th:nth-child(5),.rank td:nth-child(5),.rank th:nth-child(7),.rank td:nth-child(7){display:none}
  }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    </div>
  </header>

  <main id="app"></main>
</div>

<script>
(function(){
'use strict';
var METRICS=[
  {key:'c',name:'종가 상승',short:'종가',cls:'m-c',v:'--m-close'},
  {key:'h',name:'고점 돌파',short:'고점',cls:'m-h',v:'--m-high'},
  {key:'l',name:'저점 돌파',short:'저점',cls:'m-l',v:'--m-low'}
];
var SIG={buy:'매수',wait:'관망',sell:'매도'};
var W_DAY=[1,.85,.7,.55,.45,.35], W_M={c:.4,h:.3,l:.3};

var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var fmtDate=function(s){return String(s).replace(/\s*Day\s*$/i,'')};
var round=Math.round;

/* ---------- CSV ---------- */
function parseCSV(text){
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; }
      else f+=ch;
    }else if(ch==='"') q=true;
    else if(ch===','){row.push(f);f='';}
    else if(ch==='\n'||ch==='\r'){
      if(ch==='\r'&&text[i+1]==='\n') i++;
      row.push(f);f='';
      if(row.some(function(x){return x!==''})) rows.push(row);
      row=[];
    }else f+=ch;
  }
  if(f!==''||row.length){row.push(f); if(row.some(function(x){return x!==''})) rows.push(row);}
  return rows;
}
function parseCell(s){
  var m=String(s==null?'':s).match(/(\d+(?:\.\d+)?|nan)\s*%[^(]*\(\s*([A-Za-z]+)\s*,\s*(\d+(?:\.\d+)?)\s*\)/i);
  if(!m) return null;
  var sg=m[2].toLowerCase(); if(!SIG[sg]) sg='wait';
  return {p:/nan/i.test(m[1])?null:+m[1],s:sg,n:+m[3]};
}
function dayIndex(s){
  var m=String(s).match(/(\d{1,2})\s*-\s*(\d{1,2})/); if(!m) return null;
  return Math.round(Date.UTC(2001,+m[1]-1,+m[2])/86400000);
}
function wrapDelta(d){ if(d>182) d-=365; if(d<-182) d+=365; return d; }
/* D+1 날짜가 기준일 당일 또는 다음 날이면 정상, 그 외는 데이터 지연으로 봅니다 */
function isStale(ref,startDate){
  var a=dayIndex(ref), b=dayIndex(startDate); if(a==null||b==null) return false;
  var d=wrapDelta(b-a); return d<0||d>1;
}
function todayIdx(){
  try{
    var g={}; new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).forEach(function(x){g[x.type]=x.value});
    return dayIndex(g.month+'-'+g.day);
  }catch(e){ var n=new Date(); return dayIndex((n.getMonth()+1)+'-'+n.getDate()); }
}
/* SEQ가 1~6을 넘어 이어지거나 날짜가 크게 건너뛰는 경우 구간을 나눕니다 */
function splitRuns(days){
  var runs=[], run=[];
  days.forEach(function(e,i){
    if(i>0){
      var p=days[i-1], dd=wrapDelta(dayIndex(e.date)-dayIndex(p.date));
      if(e.seq!==p.seq+1||dd<=0||dd>7){ runs.push(run); run=[]; }
    }
    run.push(e);
  });
  if(run.length) runs.push(run);
  return runs;
}
/* 기준일: 파일의 예측 수행일과 D+1 날짜가 맞으면 그 날짜, 안 맞으면 오늘(KST)에 가까운 D+1 날짜 */
function pickRef(pd,coins){
  var p=dayIndex(pd), near=0, cnt={}, dates=[];
  coins.forEach(function(co){
    var ok=false;
    co.runs.forEach(function(r){
      var d0=r[0].date; cnt[d0]=(cnt[d0]||0)+1; if(dates.indexOf(d0)<0) dates.push(d0);
      if(p!=null){ var d=wrapDelta(dayIndex(d0)-p); if(d>=0&&d<=1) ok=true; }
    });
    if(ok) near++;
  });
  if(p!=null&&coins.length&&near/coins.length>=0.3) return {ref:pd,mismatch:false};
  var t0=todayIdx(), best=null, bd=1e9;
  dates.forEach(function(d0){ var x=Math.abs(wrapDelta(dayIndex(d0)-t0)); if(x<bd){bd=x;best=d0;} });
  if(best&&bd<=10) return {ref:best,mismatch:true};
  var modal=dates.slice().sort(function(a,b){return cnt[b]-cnt[a]})[0];
  return {ref:modal||pd,mismatch:(modal||pd)!==pd};
}
function build(text){
  var rows=parseCSV(text.replace(/^\uFEFF/,''));
  if(rows.length<2) throw new Error('데이터 행이 없습니다. 첫 행은 컬럼명, 둘째 행부터 데이터여야 합니다.');
  var head=rows[0].map(function(h){return h.trim().toLowerCase()});
  var need=['pred_day','coin','seq','date','close_up','high_up','low_up'];
  var miss=need.filter(function(k){return head.indexOf(k)<0});
  if(miss.length) throw new Error('없는 컬럼: '+miss.join(', '));
  var ix={grp:head.indexOf('grp')}; need.forEach(function(k){ix[k]=head.indexOf(k)});
  var byDay={}, bad=0;
  rows.slice(1).forEach(function(r){
    var c=parseCell(r[ix.close_up]),h=parseCell(r[ix.high_up]),l=parseCell(r[ix.low_up]);
    var seq=parseInt(r[ix.seq],10), pd=(r[ix.pred_day]||'').trim(), coin=(r[ix.coin]||'').trim();
    var grp=ix.grp>=0?(r[ix.grp]||'').trim():'';
    if(!c||!h||!l||!seq||!pd||!coin){bad++;return;}
    var d=byDay[pd]||(byDay[pd]={}), g=d[grp]||(d[grp]={});
    var co=g[coin]||(g[coin]={name:coin,days:[],stale:false});
    var en={seq:seq,date:(r[ix.date]||'').trim(),c:c,h:h,l:l};
    var ex=-1; co.days.forEach(function(e,k){if(e.seq===seq) ex=k});
    if(ex>=0) co.days[ex]=en; else co.days.push(en);
  });
  var preds=Object.keys(byDay).sort();
  if(!preds.length) throw new Error('읽을 수 있는 행이 없습니다. close_up 형식이 "47%,(Wait,20)" 인지 확인해 주세요.');
  var out={preds:preds,days:{},groups:{},bad:bad,ref:{},mismatch:{},multi:{}};
  preds.forEach(function(pd){
    out.groups[pd]=Object.keys(byDay[pd]).sort();
    out.days[pd]={};
    var all=[];
    out.groups[pd].forEach(function(g){
      Object.keys(byDay[pd][g]).forEach(function(k){
        var co=byDay[pd][g][k]; co.days.sort(function(a,b){return a.seq-b.seq}); co.runs=splitRuns(co.days); all.push(co);
      });
    });
    var pr=pickRef(pd,all), multi=[];
    out.ref[pd]=pr.ref; out.mismatch[pd]=pr.mismatch;
    out.groups[pd].forEach(function(g){
      out.days[pd][g]=Object.keys(byDay[pd][g]).sort().map(function(k){
        var co=byDay[pd][g][k], run=co.runs[0];
        if(co.runs.length>1){
          multi.push(co.name);
          var best=-1, bs=1e9;
          co.runs.forEach(function(r,i){
            var d=wrapDelta(dayIndex(r[0].date)-dayIndex(pr.ref));
            var s=(d>=0&&d<=1)?-1:Math.abs(d);
            if(s<bs||(s===bs&&i>best)){bs=s;best=i;}
          });
          run=co.runs[best];
          co.days=run.map(function(e,i){return {seq:i+1,date:e.date,c:e.c,h:e.h,l:e.l}});
        }
        co.start=co.days[0].date; co.stale=isStale(pr.ref,co.start);
        co.nan=co.days.some(function(e){return e.c.p==null||e.h.p==null||e.l.p==null});
        co.out=co.stale||co.nan;
        return co;
      });
    });
    out.multi[pd]=multi;
  });
  return out;
}

/* ---------- scoring ---------- */
function dayScore(e){
  var s=0;
  METRICS.forEach(function(m){var x=e[m.key]; s+=W_M[m.key]*(0.6*Math.min(x.n/40,1)*100+0.4*(x.p||0))});
  return s;
}
function stat(co){
  var num=0,den=0,best=null,avg={c:0,h:0,l:0},buys=[];
  co.days.forEach(function(e){
    var w=W_DAY[e.seq-1]; if(w==null) w=.3;
    var ds=dayScore(e); num+=w*ds; den+=w;
    if(!best||ds>best.ds) best={e:e,ds:ds};
    METRICS.forEach(function(m){
      avg[m.key]+=(e[m.key].p||0)/co.days.length;
      if(e[m.key].s==='buy') buys.push({seq:e.seq,k:m.key});
    });
  });
  return {co:co,score:num/den,buys:buys,avg:avg,best:best.e};
}
function insight(st){
  var buys=st.buys,avg=st.avg,name=st.co.name;
  var daysBuy={}; buys.forEach(function(b){daysBuy[b.seq]=1});
  var nDays=Object.keys(daysBuy).length;
  var near=buys.filter(function(b){return b.seq<=3}).length;
  var total=st.co.days.length;
  var l1;
  if(buys.length){
    l1=name+': '+total+'일 중 '+nDays+'일에 매수 신호가 나왔고(총 '+buys.length+'건'+(near?', D+1~D+3에 '+near+'건':'')+'), 종가 상승 확률은 평균 '+round(avg.c)+'%입니다.';
  }else{
    l1=name+': 매수 신호는 없지만 상승 확률과 신호 강도가 다른 '+CFG.noun+'보다 상대적으로 높은 순위입니다.';
  }
  var hi=avg.h>=55, lo=avg.l>=55;
  var pat=hi&&lo?'고점과 저점 모두 전일보다 올라갈 확률이 커서 가격대 전체가 올라가는 흐름에 가깝습니다.'
    :hi?'고점 돌파 확률만 높고 저점은 밀릴 수 있어 변동성에 유의하세요.'
    :lo?'저점이 전일보다 올라갈 확률이 높아 하락 시에도 아래가 받쳐주는 흐름입니다.'
    :'고점·저점 확률은 뚜렷하지 않아 종가 신호 위주로 보는 편이 좋습니다.';
  var l2=pat+' 신호가 가장 강한 날은 '+fmtDate(st.best.date)+'(D+'+st.best.seq+')입니다.';
  if(avg.c<50) l2+=' 다만 종가 상승 확률 평균이 50% 미만이라 단독 근거로는 약합니다.';
  return [l1,l2];
}

  $('#more').onclick=function(){state.showAll=!state.showAll;renderRank();};

function renderRank(){

function renderChartControls(){
  var co=cur.byName.get(state.coin).co;

  var sn=$('#staleNote');
  if(co.out){
    sn.hidden=false;
    var why=[];
    if(co.stale) why.push(esc(co.name)+'의 예측은 '+esc(fmtDate(co.start))+'부터 시작해 기준일('+esc(fmtDate(refDay()))+')과 어긋나 있습니다.');
    if(co.nan) why.push('일부 지표의 예측값이 비어 있습니다.');
    sn.innerHTML='<span class="flag">'+(co.stale?'데이터 지연':'값 결측')+'</span>'+why.join(' ')+' 그래서 순위에서 제외했습니다.';
  }else sn.hidden=true;
  var h='<span class="lab">날짜</span>';

    h+='<button class="chip" data-seq="'+e.seq+'" aria-pressed="'+state.days.has(e.seq)+'">D+'+e.seq+' <small>'+esc(fmtDate(e.date))+'</small></button>';
  });

  $('#dayChips').onclick=function(ev){
    var b=ev.target.closest('button'); if(!b) return;
    if(b.dataset.all){state.days=new Set(co.days.map(function(e){return e.seq}));}
    else{
      var q=+b.dataset.seq;
      if(state.days.has(q)){ if(state.days.size>1) state.days.delete(q); }
      else state.days.add(q);
    }
    renderChartControls(); renderChart(); renderTable();
  };
  $('#metChips').onclick=function(ev){
    var b=ev.target.closest('button'); if(!b) return;
    var k=b.dataset.m;

    else state.metrics.add(k);

  };
}
var lastW=0;
function renderChart(){
  var st=cur.byName.get(state.coin); if(!st) return;
  var days=st.co.days.filter(function(e){return state.days.has(e.seq)});
  var box=$('#chart'); if(!box) return;
  var W=Math.max(300,Math.floor(box.clientWidth)||720); lastW=W;
  var H=W<520?300:360, mg={l:42,r:14,t:14,b:52}, iw=W-mg.l-mg.r, ih=H-mg.t-mg.b, n=days.length, step=iw/n;
  var X=function(i){return mg.l+step*(i+.5)}, Y=function(v){return mg.t+ih*(1-v/100)};
  var vis=METRICS.filter(function(m){return state.metrics.has(m.key)});
  var g='';
  [0,25,50,75,100].forEach(function(v){
    g+='<line class="'+(v===50?'g50':'g')+'" x1="'+mg.l+'" x2="'+(W-mg.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/>';
    g+='<text class="yl" x="'+(mg.l-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'%</text>';
  });
  days.forEach(function(e,i){
    g+='<text class="xl" x="'+X(i)+'" y="'+(H-mg.b+22)+'" text-anchor="middle">'+esc(fmtDate(e.date))+'</text>';
    g+='<text class="xl2" x="'+X(i)+'" y="'+(H-mg.b+38)+'" text-anchor="middle">D+'+e.seq+'</text>';
  });
  vis.slice().reverse().forEach(function(m){
    if(days.length>1){
      var d='',pen=false;
      days.forEach(function(e,i){var v=e[m.key].p; if(v==null){pen=false;return;} d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1); pen=true;});
      if(d) g+='<path class="ln '+m.cls+'" d="'+d+'"/>';
    }
  });
  vis.forEach(function(m){
    days.forEach(function(e,i){
      var x=e[m.key]; if(x.p==null) return;
      g+='<circle class="mk '+x.s+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(x.p).toFixed(1)+'" r="'+(x.s==='buy'?7.5:6)+'"><title>'+esc(fmtDate(e.date))+' '+m.name+' '+x.p+'% '+SIG[x.s]+' '+x.n+'</title></circle>';
    });
  });
  g+='<line class="guide" id="guide" y1="'+mg.t+'" y2="'+(mg.t+ih)+'" x1="0" x2="0" style="display:none"/>';
  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(state.coin)+' 6일 예측 확률 꺾은선 그래프. 아래 표에 같은 값이 있습니다.">'+g+'</svg><div class="tip" id="tip" style="display:none"></div>';
  var svg=box.querySelector('svg'), tip=$('#tip'), guide=$('#guide');
  function show(ev){
    var r=svg.getBoundingClientRect(), x=(ev.clientX-r.left)*(W/r.width);
    var i=Math.max(0,Math.min(n-1,Math.floor((x-mg.l)/step)));
    var e=days[i], cx=X(i);
    guide.setAttribute('x1',cx); guide.setAttribute('x2',cx); guide.style.display='';
    var t='<div class="tip-h">'+esc(fmtDate(e.date))+'<span>D+'+e.seq+'</span></div>';
    vis.forEach(function(m){var v=e[m.key]; t+='<div class="tip-r"><i class="sw" style="background:var('+m.v+')"></i><span>'+m.name+'</span>'+(v.p==null?'<b>–</b><em class="tag wait">값 없음</em>':'<b>'+v.p+'%</b><em class="tag '+v.s+'">'+SIG[v.s]+' '+v.n+'</em>')+'</div>'});
    tip.innerHTML=t; tip.style.display='block';
    var px=cx*(r.width/W), tw=tip.offsetWidth;
    var left=px+16; if(left+tw>r.width) left=px-tw-16; if(left<0) left=0;
    tip.style.left=left+'px';
  }
  function hide(){tip.style.display='none';guide.style.display='none';}
  svg.addEventListener('pointermove',show); svg.addEventListener('pointerdown',show);
  svg.addEventListener('pointerleave',hide);
}
function renderTable(){
  var st=cur.byName.get(state.coin); if(!st) return;
  var days=st.co.days.filter(function(e){return state.days.has(e.seq)});
  var vis=METRICS.filter(function(m){return state.metrics.has(m.key)});
  var h='<table class="det"><thead><tr><th>날짜</th>'+vis.map(function(m){return '<th>'+m.name+'</th>'}).join('')+'</tr></thead><tbody>';
  days.forEach(function(e){
    h+='<tr><td class="d">'+esc(fmtDate(e.date))+'<small>D+'+e.seq+'</small></td>';
    vis.forEach(function(m){var x=e[m.key]; h+=x.p==null?'<td><b>–</b><em class="tag wait">값 없음</em></td>':'<td><b>'+x.p+'%</b><em class="tag '+x.s+'">'+SIG[x.s]+' '+x.n+'</em></td>'});
    h+='</tr>';
  });
  $('#tbl').innerHTML=h+'</tbody></table>';
}
function renderAll(){renderHeader();renderApp();}

/* ---------- boot / upload ---------- */
function load(text,src,keep){
  var d=build(text);
  var prev=(keep&&cur)?{coin:state.coin,days:Array.from(state.days),grp:state.grp}:null;
  DATA=d; state.src=src;
  setPred(d.preds[d.preds.length-1],prev&&prev.grp);
  if(prev&&cur.byName.has(prev.coin)){
    state.coin=prev.coin;
    var seqs=cur.byName.get(prev.coin).co.days.map(function(e){return e.seq});
    var ds=prev.days.filter(function(x){return seqs.indexOf(x)>=0});
    state.days=new Set(ds.length?ds:seqs);
  }
  renderAll();
  return d;
}

try{

/* ---------- Google Drive sync (SYNC build only) ---------- */
var DRIVE='Google Drive', FILE_NAME='final_rst_dfa_web_Day_v3.csv';
var live={busy:false,blocked:false,manual:false,lastOk:0,mcp:undefined};
function decodeB64(s){
  s=String(s).replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');
  var bin=atob(s), n=bin.length, u=new Uint8Array(n);
  for(var i=0;i<n;i++) u[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(u);
}
function asObj(p){
  if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){return null}}
  return p&&typeof p==='object'?p:null;
}
function fmtKST(iso){
  try{
    var d=new Date(iso); if(isNaN(d.getTime())) return '';
    var g={}; new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).forEach(function(x){g[x.type]=x.value});
    return g.month+'-'+g.day+' '+g.hour+':'+g.minute;
  }catch(e){return ''}
}
function setMsg(t,cls){msg.className=cls||'';msg.textContent=t;}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function driveErr(err){
  switch(err&&err.code){
    case 'needs_reauth': return '구글 드라이브 연결이 만료됐어요. claude.ai 설정 → 커넥터에서 다시 연결해 주세요.';
    case 'server_not_connected': return '구글 드라이브 커넥터가 연결돼 있지 않아요. claude.ai 설정 → 커넥터에서 추가해 주세요.';
    case 'selection_required': return '구글 드라이브 계정이 여러 개예요. 사용할 계정을 선택해 주세요.';
    case 'not_in_manifest': return '드라이브 접근이 허용되지 않았어요. "드라이브에서 다시 불러오기"를 눌러 허용해 주세요.';
    case 'blocked_by_policy': case 'approval_required': return '조직 정책 때문에 드라이브를 읽을 수 없어요.';
    case 'not_granted': case 'capability_disabled': case 'capability_removed': return '이 화면에서는 드라이브 연동을 쓸 수 없어요. CSV 직접 불러오기를 이용해 주세요.';
    case 'tool_error': return '드라이브가 오류를 돌려줬어요: '+(err.message||'');
    case 'server_unavailable': case 'upstream_error': return '드라이브에 일시적으로 연결하지 못했어요. 잠시 뒤 다시 불러오기를 눌러 주세요.';
    default: return '드라이브에서 불러오지 못했어요'+(err&&err.message?': '+err.message:'.');
  }
}
var BLOCKING={needs_reauth:1,server_not_connected:1,selection_required:1,not_in_manifest:1,blocked_by_policy:1,approval_required:1,not_granted:1,capability_disabled:1,capability_removed:1};
async function fetchDrive(mcp){
  var sr=await mcp.callTool(DRIVE,'search_files',{query:"title = '"+FILE_NAME+"'",pageSize:10,excludeContentSnippets:true},{cache:false});
  var so=asObj(sr&&sr.payload), files=(so&&so.files)||[];
  if(!files.length){var e=new Error('nofile'); e.code='nofile'; throw e;}
  files.sort(function(a,b){return String(b.modifiedTime||'').localeCompare(String(a.modifiedTime||''))});
  var f=files[0];
  var dr=await mcp.callTool(DRIVE,'download_file_content',{fileId:f.id},{cache:false});
  var dob=asObj(dr&&dr.payload);
  if(!dob||typeof dob.content!=='string'){var e2=new Error('nocontent'); e2.code='nocontent'; throw e2;}
  return {file:f,text:decodeB64(dob.content)};
}
async function loadFromDrive(){
  if(live.busy) return;
  live.busy=true; live.blocked=false;
  var btn=$('#reload'); if(btn) btn.disabled=true;
  setMsg('구글 드라이브에서 불러오는 중','');
  try{
    if(live.mcp===undefined){
      var C=window.claude;
      live.mcp=(C&&typeof C.use==='function')?await C.use('mcp'):null;
    }
    if(!live.mcp){ var e0={code:'capability_disabled'}; throw e0; }
    var out;
    try{ out=await fetchDrive(live.mcp); }
    catch(err){
      if(err&&err.retryable){ await sleep(Math.min(err.retryAfterMs||1500,5000)+Math.random()*500); out=await fetchDrive(live.mcp); }
      else throw err;
    }
    var d=load(out.text,'구글 드라이브',true);
    live.lastOk=Date.now(); live.manual=false;
    setMsg('구글 드라이브 최신 파일을 불러왔어요. 파일 수정 '+fmtKST(out.file.modifiedTime)+(d.bad?' ('+d.bad+'행은 형식이 달라 건너뜀)':''),'');
  }catch(err){
    var c=err&&err.code, text;
    if(c==='nofile') text='드라이브에서 "'+FILE_NAME+'" 파일을 찾지 못했어요. 파일 이름을 확인해 주세요.';
    else if(c==='nocontent') text='드라이브 파일 내용을 읽지 못했어요.';
    else if(!c) text='드라이브 파일 형식을 읽지 못했어요: '+(err&&err.message||'');
    else text=driveErr(err);
    if(BLOCKING[c]) live.blocked=true;
    setMsg(text+' 지금은 내장 데이터를 보여드려요.','err');
  }finally{
    live.busy=false; if(btn) btn.disabled=false;
  }
}
if(SYNC){
  $('#reload').hidden=false;
  $('#fileLab').textContent='CSV 직접 불러오기';
  $('#reload').addEventListener('click',function(){live.manual=false;loadFromDrive();});
  var due=function(){return !document.hidden&&!live.busy&&!live.blocked&&!live.manual&&live.lastOk&&Date.now()-live.lastOk>10*60*1000};
  setInterval(function(){if(due()) loadFromDrive();},60000);
  document.addEventListener('visibilitychange',function(){if(due()) loadFromDrive();});
  loadFromDrive();
}

if(HOST&&!SYNC&&/^https?:$/.test(location.protocol)){

    })
    .catch(function(){ setMsg('데이터를 불러오지 못했어요. 새로고침하거나 로그인·이용 기간을 확인해 주세요','err'); });
}
if(window.ResizeObserver){
  var t=null;
  new ResizeObserver(function(){
    var b=$('#chart'); if(!b||!cur) return;
    if(Math.abs(b.clientWidth-lastW)<2) return;
    clearTimeout(t); t=setTimeout(renderChart,60);
  }).observe(document.body);
}
})();
